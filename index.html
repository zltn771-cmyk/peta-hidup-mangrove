<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Peta Hidup Mangrove — Monitor. Understand. Protect.</title>
    <meta name="description" content="Platform pemantauan ekosistem mangrove di Provinsi Bengkulu berbasis komputasi awan, data satelit Sentinel-2, indeks spektral (CMRI, MVI, NDMI), dan kecerdasan buatan." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Leaflet CSS (CDN) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS (CDN) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLEo=" crossorigin=""></script>
    <style>
      /* Override Leaflet z-index so it stays inside the card */
      .leaflet-pane, .leaflet-top, .leaflet-bottom { z-index: 10 !important; }
      .leaflet-control { z-index: 20 !important; }
      .leaflet-container { font-family: 'Plus Jakarta Sans', sans-serif; border-radius: 0; }
      /* Custom Leaflet popup style */
      .leaflet-popup-content-wrapper {
        border-radius: 14px !important;
        box-shadow: 0 8px 24px rgba(23,75,50,0.15) !important;
        border: 1px solid #E2EAE2 !important;
        padding: 0 !important;
        overflow: hidden;
      }
      .leaflet-popup-content { margin: 0 !important; }
      .leaflet-popup-tip-container { display: none; }
      .mangrove-popup { padding: 14px 16px; min-width: 220px; }
      .mangrove-popup .pop-title { font-weight: 700; font-size: 13px; color: #1D2A22; margin-bottom: 4px; }
      .mangrove-popup .pop-sub { font-size: 11px; color: #718075; margin-bottom: 10px; }
      .mangrove-popup .pop-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
      .mangrove-popup .pop-label { color: #A8BFA5; }
      .mangrove-popup .pop-val { font-weight: 600; color: #1D2A22; }
      .mangrove-popup .pop-badge { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; }
      .mangrove-popup .pop-sim { margin-top: 10px; padding-top: 8px; border-top: 1px solid #E2EAE2; font-size: 9px; color: #D97706; font-weight: 600; }
      /* Leaflet custom marker */
      .mangrove-marker { transition: transform 0.15s; }
      .mangrove-marker:hover { transform: scale(1.2); }
    </style>
  </head>
  <body class="bg-[#F5F8F5] text-[#1D2A22] antialiased selection:bg-[#A8BFA5]/30 selection:text-[#103D2B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
